<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Meridian</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#080b1a;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
  /* real <img>, not canvas-drawn — the canvas backing store is capped to
     1x device pixels for performance (see resize() below), which blurs
     anything crisp drawn into it on a retina screen. A native <img>
     renders through the browser's own compositor at full display
     resolution regardless, same fix core.js already uses for the task
     panel's text. */
  #logo-wrap{position:fixed;left:28px;top:28px;width:44px;height:40px;overflow:hidden;z-index:40;pointer-events:none}
  #logo-wrap img{display:block;height:40px;width:auto}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="logo-wrap"><img src="assets/meridian-mark.png" alt=""></div>
<script src="../../core.js"></script>
<script>
/* ============================================================
   Aura face: the brand orb alone inside a soft two-tone cloud of
   light — no rings, no waves, nothing linear at all, which is the
   whole point of this one. The house principles still carry over,
   just translated for a design with no line to put them on: smooth
   many-stop fades (even more important here, since the glow IS the
   whole face), a gentle always-on breathing motion in place of an
   always-on secondary line, and soft pulse rings that only appear
   while thinking/speaking in place of the coil that only appears
   then on the other faces.
   ============================================================ */
"use strict";
// Meridian's own activation chime, not Jared's generic thinking.wav.
// core.js (one of the four unmodified upstream components) always loads
// its own shared assets/thinking.wav with no override hook exposed, and
// it's not this project's file to edit — so the swap happens here, at
// the face level, via a temporary Audio() patch active only for the
// single synchronous instant core.js's own soundInit() constructs its
// player (inside AV.init, called synchronously below, nothing async
// in between). Restored immediately after, so nothing else is affected.
(() => {
  const RealAudio = window.Audio;
  window.Audio = function (src) {
    const a = new RealAudio(
      src && String(src).includes("thinking.wav") ? "assets/activate-chime.wav" : src
    );
    // Preview-only: the demo script's own "thinking" phase (core.js,
    // 4.2s) is shorter than this chime (~11s), so core.js's stopSound()
    // would cut it short. Just no-op'ing pause() wasn't enough — that
    // function also sets currentTime = 0 right after pause(), which
    // still rewound the still-running clip back to the start, sounding
    // like a restart rather than one clean play-through. Swallow
    // exactly that one paired reset (and only that one) so the
    // legitimate "start fresh" reset before each real play() call still
    // works normally on every later cycle. AV.demo is never true in a
    // real install, so production behavior (cut off when thinking
    // actually ends) is untouched.
    if (AV.demo) {
      let swallowNextSeek = false;
      a.pause = () => { swallowNextSeek = true; };
      const desc = Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, "currentTime");
      Object.defineProperty(a, "currentTime", {
        get() { return desc.get.call(a); },
        set(v) {
          if (swallowNextSeek) { swallowNextSeek = false; return; }
          desc.set.call(a, v);
        }
      });
    }
    return a;
  };
  AV.init({});
  window.Audio = RealAudio;
})();
AV.ready(a => { document.title = a.name || "Meridian"; });

if (AV.demo && !new URLSearchParams(location.search).get("name")){
  AV.name = "Meridian";
  AV.label = "M.E.R.I.D.I.A.N.";
}

(() => {
  const s = document.createElement("style");
  s.textContent = `
    #av-task-panel{
      background: rgba(20,28,56,0.72);
      border: 1px solid rgba(138,107,255,0.35);
      border-radius: 16px;
      box-shadow: 0 1px 0 rgba(255,255,255,.14) inset, 0 8px 24px rgba(79,195,255,.15), 0 0 22px rgba(138,107,255,.14);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      font-family: -apple-system, "SF Pro Display", sans-serif;
    }
    #av-task-panel .av-task-head{ color: rgba(191,228,255,0.9); }
    #av-task-panel .av-task-dot{ background: linear-gradient(90deg,#4fc3ff,#8a6bff); }
    #av-task-panel .av-task-label{ color: rgba(236,242,250,0.95); }
    #av-task-panel .av-task-bars i{ background: linear-gradient(180deg,#4fc3ff,#8a6bff); }
  `;
  document.head.appendChild(s);
})();

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let W = 0, H = 0, DPR = 1, cx = 0, cy = 0, R = 0;

const orbitRef = new Image();
let orbitRefReady = false;
orbitRef.onload = () => { orbitRefReady = true; };
orbitRef.src = "assets/orbit-reference.png";
const ORBIT_REF_SRC = { sx: 140, sy: 137, sw: 980, sh: 980 };

function resize(){
  // capped at 1x, not 2x — the background/cloud/ring gradients this face
  // repaints are the real cost, and halving the pixel count per axis on a
  // retina display cuts that by ~4x, the single biggest lever for
  // low-power machines
  DPR = Math.min(1, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  cx = W / 2; cy = H * 0.44;
  R = Math.min(H, W) * 0.135;
}
addEventListener("resize", resize);
resize();

function roundRectPath(g, x, y, w, h, r){
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

const BREATHE_AMT = { idle: 0.03, listening: 0.045, thinking: 0.03, speaking: 0.0 };
const BREATHE_HZ  = { idle: 0.35, listening: 0.55, thinking: 0.9,  speaking: 0 };
const AURA_ACTIVE = { idle: 0, listening: 0.2, thinking: 0.55, speaking: 0.9 };

let clock = 0;
let breathePhase = 0;
let workFade = 0;
let pulseClock = 0;
let ringTiltPhase = 0;
let echoAngle = 0;
let coilPhase = 0;

function drawBackground(gctx, clock){
  gctx.shadowBlur = 0;
  gctx.fillStyle = "#05060f";
  gctx.fillRect(0, 0, W, H);

  const driftB = Math.sin(clock * 0.05) * 0.035;
  const blueX = W * (0.32 + driftB), blueY = H * (0.14 - driftB * 0.6);
  const blueA = 0.85 + Math.sin(clock * 0.045) * 0.15;
  const blue = gctx.createRadialGradient(blueX, blueY, 0, blueX, blueY, Math.max(W, H) * 0.62);
  blue.addColorStop(0, `rgba(20,55,150,${0.68 * blueA})`);
  blue.addColorStop(0.55, `rgba(12,32,100,${0.36 * blueA})`);
  blue.addColorStop(1, "rgba(12,32,100,0)");
  gctx.fillStyle = blue;
  gctx.fillRect(0, 0, W, H);

  const driftP = Math.sin(clock * 0.038 + 2.1) * 0.035;
  const purpX = W * (0.78 + driftP), purpY = H * (0.78 - driftP * 0.5);
  const purpA = 0.85 + Math.sin(clock * 0.052 + 1.4) * 0.15;
  const purple = gctx.createRadialGradient(purpX, purpY, 0, purpX, purpY, Math.max(W, H) * 0.58);
  purple.addColorStop(0, `rgba(85,20,165,${0.42 * purpA})`);
  purple.addColorStop(0.55, `rgba(42,14,95,${0.22 * purpA})`);
  purple.addColorStop(1, "rgba(42,14,95,0)");
  gctx.fillStyle = purple;
  gctx.fillRect(0, 0, W, H);
}

// Every drift term above is sub-0.1Hz — nothing in this background moves
// fast enough for the eye to tell 10 repaints/sec from 60. Baked to an
// offscreen sprite and only repainted on that slower clock, same
// sprite-cache lesson as the ring glows below, just keyed on elapsed time
// instead of a fixed parameter tuple since this one drifts continuously
// rather than switching between discrete states.
let bgSprite = null, bgSpriteW = 0, bgSpriteH = 0, bgSpriteClock = -999;
const BG_REFRESH_SEC = 1 / 10;
function getBackgroundSprite(clock){
  if (!bgSprite) bgSprite = document.createElement("canvas");
  const resized = bgSpriteW !== W || bgSpriteH !== H;
  if (resized || clock - bgSpriteClock >= BG_REFRESH_SEC){
    bgSprite.width = W; bgSprite.height = H;
    drawBackground(bgSprite.getContext("2d"), clock);
    bgSpriteW = W; bgSpriteH = H; bgSpriteClock = clock;
  }
  return bgSprite;
}

/* A ring hugging close around the orb itself, not a distant orbit —
   Seb's call, after seeing the lineless version: add one back in
   anyway, just kept tight to the ball. Same three-layer treatment
   (halo, crisp core, near-white centerline) and the same sprite-cached
   tip bloom as the Orbit face's own ring, just a rounder aspect ratio
   and a much smaller radius so it reads as a halo, not an orbit. */
/* the coiling thread, same technique as the other faces — a wire that
   visibly wraps the ring's own tube, only while thinking/speaking.
   Cheap (no shadowBlur per segment, one soft pass underneath instead),
   so no sprite caching needed here. */
function drawHaloCoil(radiusMult, tilt, alpha, phase){
  // rebuilt — the original drew each of ~540 tiny segments as its own
  // separate beginPath/stroke call (needed to vary line width per
  // segment for a wrapping-thickness effect). That's roughly 540
  // individual draw-call dispatches every single frame, continuously,
  // the entire time thinking/speaking — by far the heaviest thing in
  // this file, and the real reason reducing shadowBlur elsewhere never
  // fixed the lag. Orbit's own ring coil draws the same wobble as ONE
  // continuous path with a single stroke() call; doing the same here
  // drops this from ~540 draw calls to 2.
  const rx = R * radiusMult, ry = rx * 0.62;
  const wraps = 30, amp = R * 0.028;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(tilt);
  ctx.globalCompositeOperation = "screen";

  const segs = wraps * 18;
  ctx.beginPath();
  for (let i = 0; i <= segs; i++){
    const t = (i / segs) * 6.2832;
    const bx = Math.cos(t) * rx, by = Math.sin(t) * ry;
    const tdx = -Math.sin(t) * rx, tdy = Math.cos(t) * ry;
    const tl = Math.hypot(tdx, tdy) || 1, nx = -tdy / tl, ny = tdx / tl;
    const wob = Math.sin(t * wraps + phase);
    const px = bx + nx * wob * amp, py = by + ny * wob * amp;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.strokeStyle = `rgba(225,235,255,${alpha * 0.85})`;
  ctx.lineWidth = 1;
  ctx.shadowBlur = 0;
  ctx.stroke();

  ctx.strokeStyle = `rgba(190,215,255,${alpha * 0.3})`;
  ctx.lineWidth = 1.2;
  ctx.shadowColor = "#bfe4ff";
  ctx.shadowBlur = 8;
  ctx.stroke();

  ctx.globalCompositeOperation = "source-over";
  ctx.restore();
}

function drawHaloRing(radiusMult, tilt, angle, baseAlpha, state, thin){
  const rx = R * radiusMult, ry = rx * 0.62;
  const activeBoost = AURA_ACTIVE[state] ?? 0;
  const alpha = Math.min(1, baseAlpha * (0.5 + activeBoost));

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(tilt);
  ctx.beginPath();
  const segs = 120;
  for (let i = 0; i <= segs; i++){
    const t = (i / segs) * 6.2832 + angle;
    const px = Math.cos(t) * rx, py = Math.sin(t) * ry;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();

  // shadowBlur is the expensive part of every draw on these faces, and
  // this ring was stacking three full-path shadowed strokes on a large
  // closed ellipse, every frame, on top of everything else running
  // simultaneously during thinking/speaking — cut to a single shadowed
  // pass plus one cheap unshadowed core line, same visual read for
  // meaningfully less cost
  const grad = ctx.createLinearGradient(-rx, 0, rx, 0);
  grad.addColorStop(0, `rgba(20,160,225,${alpha})`);
  grad.addColorStop(0.5, `rgba(210,205,255,${alpha * 0.85})`);
  grad.addColorStop(1, `rgba(205,90,255,${alpha})`);
  ctx.strokeStyle = grad;
  ctx.lineWidth = thin ? 1.6 + activeBoost * 1 : 3 + activeBoost * 2;
  ctx.shadowColor = "#a070ff";
  ctx.shadowBlur = thin ? 10 + activeBoost * 5 : 16 + activeBoost * 8;
  ctx.globalAlpha = Math.min(1, (thin ? 0.4 : 0.6) + activeBoost * 0.35);
  ctx.stroke();
  ctx.globalAlpha = 1;

  if (!thin){
    ctx.shadowBlur = 0;
    const core = ctx.createLinearGradient(-rx, 0, rx, 0);
    core.addColorStop(0, `rgba(200,235,255,${alpha * 0.75})`);
    core.addColorStop(0.5, `rgba(255,255,255,${alpha * 0.9})`);
    core.addColorStop(1, `rgba(240,210,255,${alpha * 0.75})`);
    ctx.strokeStyle = core;
    ctx.lineWidth = 0.6;
    ctx.stroke();
  }
  ctx.restore();
}

function drawHaloRingEndGlow(gctx, radiusMult, tilt, state){
  const rx = R * radiusMult, ry = rx * 0.62;
  const activeBoost = AURA_ACTIVE[state] ?? 0;
  const boost = 1 + activeBoost * 0.7;
  const pt = t => [Math.cos(t) * rx, Math.sin(t) * ry];

  gctx.save();
  gctx.translate(cx, cy);
  gctx.rotate(tilt);
  gctx.globalCompositeOperation = "screen";

  const ends = [
    { tAngle: Math.PI, rgb: "20,160,225" },
    { tAngle: 0, rgb: "220,100,255" },
  ];
  const layers = [
    { width: 14, blur: 30, peak: 0.4 },
    { width: 7, blur: 18, peak: 0.65 },
    { width: 3, blur: 10, peak: Math.min(1, 0.95 * boost) },
  ];
  const span = 0.6, step = 0.02;
  for (const e of ends){
    for (const layer of layers){
      gctx.lineWidth = layer.width;
      gctx.shadowColor = `rgb(${e.rgb})`;
      gctx.shadowBlur = layer.blur;
      for (let s = -span; s < span; s += step){
        const decay = Math.exp(-Math.abs(s) / 0.22);
        const a = layer.peak * decay;
        if (a < 0.008) continue;
        const [x0, y0] = pt(e.tAngle + s);
        const [x1, y1] = pt(e.tAngle + s + step);
        gctx.strokeStyle = `rgba(${e.rgb},${a})`;
        gctx.beginPath(); gctx.moveTo(x0, y0); gctx.lineTo(x1, y1); gctx.stroke();
      }
    }
    const [tx, ty] = pt(e.tAngle);
    gctx.shadowBlur = 12;
    gctx.shadowColor = "#ffffff";
    gctx.fillStyle = `rgba(255,255,255,${Math.min(1, boost)})`;
    gctx.beginPath(); gctx.arc(tx, ty, 2.8, 0, 6.2832); gctx.fill();
  }
  gctx.restore();
}

let haloSprite = null, haloSpriteKey = "";
function getHaloRingEndGlowSprite(radiusMult, tilt, state){
  const key = `${W}x${H}|${radiusMult}|${tilt.toFixed(4)}|${state}`;
  if (haloSprite && haloSpriteKey === key) return haloSprite;
  if (!haloSprite) haloSprite = document.createElement("canvas");
  haloSprite.width = W; haloSprite.height = H;
  drawHaloRingEndGlow(haloSprite.getContext("2d"), radiusMult, tilt, state);
  haloSpriteKey = key;
  return haloSprite;
}

/* the two-tone cloud itself — cyan lobe left of the orb, violet lobe
   right, each a wide many-stop radial fade (the same lesson as every
   other glow on these faces: cram the falloff into a tight radius and
   it reads as a defined blob no matter how low the alpha gets). A slow
   independent breathing motion on each lobe's size and position is the
   "always alive" layer here, standing in for the always-on secondary
   line the other faces have. */
function drawAuraCloud(gctx, active, env, breathePhase){
  // this was the real, always-on cost difference against the other
  // faces: two full circles at ~630px radius, filled every single
  // frame regardless of state (not gated like the rings), each with a
  // 6-stop gradient under a 'screen' blend (which reads destination
  // pixels back, pricier than plain alpha). Radius halved here — area
  // scales with radius squared, so this alone cuts the fill cost to
  // roughly a quarter — and stop count trimmed to match.
  const breatheCyan = 1 + Math.sin(breathePhase) * 0.05;
  const breatheViolet = 1 + Math.sin(breathePhase * 0.8 + 1.6) * 0.05;
  const baseSpread = R * 2.6 * (1 + active * 0.18 + (env * 0.1));
  const lift = 0.35 + active * 0.25;

  gctx.save();
  gctx.globalCompositeOperation = "screen";

  const cyanX = cx - R * 1.3, cyanY = cy;
  const cyanR = baseSpread * breatheCyan;
  const cyan = gctx.createRadialGradient(cyanX, cyanY, 0, cyanX, cyanY, cyanR);
  cyan.addColorStop(0, `rgba(90,195,255,${0.5 * lift})`);
  cyan.addColorStop(0.2, `rgba(75,170,255,${0.32 * lift})`);
  cyan.addColorStop(0.5, `rgba(58,130,225,${0.12 * lift})`);
  cyan.addColorStop(1, "rgba(50,100,200,0)");
  gctx.fillStyle = cyan;
  gctx.beginPath(); gctx.arc(cyanX, cyanY, cyanR, 0, 6.2832); gctx.fill();

  const violetX = cx + R * 1.3, violetY = cy;
  const violetR = baseSpread * breatheViolet;
  const violet = gctx.createRadialGradient(violetX, violetY, 0, violetX, violetY, violetR);
  violet.addColorStop(0, `rgba(170,120,255,${0.46 * lift})`);
  violet.addColorStop(0.2, `rgba(148,95,248,${0.28 * lift})`);
  violet.addColorStop(0.5, `rgba(115,68,215,${0.1 * lift})`);
  violet.addColorStop(1, "rgba(100,60,195,0)");
  gctx.fillStyle = violet;
  gctx.beginPath(); gctx.arc(violetX, violetY, violetR, 0, 6.2832); gctx.fill();

  gctx.globalCompositeOperation = "source-over";
  gctx.restore();
}

// Breathing is slow, but env (live speech amplitude) isn't — refreshed
// three times as often as the background above so a loud word still reads
// as an immediate brightening, not a sprite catching up a beat late.
let cloudSprite = null, cloudSpriteW = 0, cloudSpriteH = 0, cloudSpriteClock = -999;
const CLOUD_REFRESH_SEC = 1 / 30;
function getAuraCloudSprite(active, env, breathePhase, clock){
  if (!cloudSprite) cloudSprite = document.createElement("canvas");
  const resized = cloudSpriteW !== W || cloudSpriteH !== H;
  if (resized || clock - cloudSpriteClock >= CLOUD_REFRESH_SEC){
    cloudSprite.width = W; cloudSprite.height = H;
    drawAuraCloud(cloudSprite.getContext("2d"), active, env, breathePhase);
    cloudSpriteW = W; cloudSpriteH = H; cloudSpriteClock = clock;
  }
  return cloudSprite;
}

/* Soft rings expanding outward from the orb, fading as they grow —
   present only while thinking/speaking, eased in and out with the same
   workFade every other face uses for its own activity-only element
   (the coil, the echo line). This is that same "extra layer of
   interest that only shows up when working" principle, translated into
   something that fits a face with no line to hang a coil on. */
function drawPulseRings(orbR, active, workFade, pulseClock){
  if (workFade < 0.01) return;
  // frequency and intensity halved per Seb's earlier call, ring count
  // and blur also trimmed here — three shadowed ring strokes a frame on
  // top of everything else this face already draws was adding up
  const ringCount = 2;
  const period = 3.6;
  ctx.save();
  ctx.globalCompositeOperation = "screen";
  for (let i = 0; i < ringCount; i++){
    const t = ((pulseClock / period) + i / ringCount) % 1;
    const r = orbR * (1.08 + t * 2.6);
    const fade = (1 - t) * workFade * (0.4 + active * 0.3) * 0.5;
    if (fade < 0.01) continue;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, 6.2832);
    ctx.strokeStyle = `rgba(180,205,255,${fade})`;
    ctx.lineWidth = Math.max(1, orbR * 0.02 * (1 - t * 0.6));
    ctx.shadowColor = "#bfe4ff";
    ctx.shadowBlur = 10;
    ctx.stroke();
  }
  ctx.globalCompositeOperation = "source-over";
  ctx.restore();
}

function frame(dt){
  AV.tick(dt);
  clock += dt / 1000;
  const state = AV.state;
  const env = AV.env || 0;
  const samples = AV.samples;

  breathePhase += 0.35 * (dt / 1000);
  const active = AURA_ACTIVE[state] ?? 0;
  const wantWork = (state === "thinking" || state === "speaking");
  workFade += ((wantWork ? 1 : 0) - workFade) * Math.min(1, (dt / 1000) * 2.2);
  pulseClock += (state === "speaking" ? 1.3 : 1) * (dt / 1000);
  ringTiltPhase += 0.1 * (dt / 1000);
  echoAngle += (state === "speaking" ? 0.5 : state === "thinking" ? 0.35 : 0.2) * (dt / 1000);
  coilPhase += (state === "speaking" ? 2.2 : 1.6) * (dt / 1000);

  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(getBackgroundSprite(clock), 0, 0);
  ctx.save();
  ctx.globalCompositeOperation = "screen";
  ctx.drawImage(getAuraCloudSprite(active, env, breathePhase, clock), 0, 0);
  ctx.restore();

  // the main ring, always present, hugging close around the orb. The
  // expensive end-glow bloom stays sprite-cached at a FIXED tilt
  // (RING_BASE_TILT, never changes) — that cache is what blew up the
  // graphics load last time a wobble leaked into it. The cheap stroke
  // itself (drawHaloRing, just a few whole-path strokes, no per-segment
  // shadow) is free to wobble independently for visual life; the bright
  // tip-glow dots stay put while the ring body gently breathes under
  // them, same subtle-animation idea as the other faces' rings without
  // touching the cache at all.
  const RING_BASE_TILT = -0.22;
  const ringStrokeTilt = RING_BASE_TILT + Math.sin(ringTiltPhase) * 0.035;
  drawHaloRing(1.42, ringStrokeTilt, 0, 0.85, state, false);
  ctx.save();
  ctx.globalCompositeOperation = "screen";
  ctx.drawImage(getHaloRingEndGlowSprite(1.42, RING_BASE_TILT, state), 0, 0);
  ctx.restore();

  // the coil, riding the main ring, only while thinking/speaking — same
  // activity-only principle as the other faces, and cheap by the same
  // design (no per-segment shadow), so it never touches the sprite cache
  if (workFade > 0.01){
    drawHaloCoil(1.42, ringStrokeTilt, (0.65 + active * 0.25) * workFade, coilPhase);
  }

  // the companion, spawning in right next to the main ring, present
  // only while thinking/speaking, with real motion of its own. Dropped
  // its own dedicated tip-bloom sprite entirely — a full extra W×H
  // screen-blended drawImage plus its own shadowed stroke every frame,
  // for a secondary element that doesn't need the full treatment the
  // main ring gets. Its own single shadowed stroke (inside drawHaloRing's
  // thin branch) still gives it a real glow, just without the second
  // sprite composite stacked on top.
  if (workFade > 0.01){
    const echoStrokeTilt = RING_BASE_TILT + Math.sin(ringTiltPhase * 1.6 - 1.1) * 0.09;
    drawHaloRing(1.58, echoStrokeTilt, echoAngle, 0.6 * workFade, state, true);
  }

  const breathe = state === "speaking"
    ? 1 + env * 0.16
    : 1 + Math.sin(clock * (BREATHE_HZ[state] ?? 0.35) * 6.2832) * (BREATHE_AMT[state] ?? 0.03);
  const orbR = R * breathe;

  drawPulseRings(orbR, active, workFade, pulseClock);
  drawOrb(orbR, state, env);
  drawStatusPill(state, samples);

  requestAnimationFrame(() => frame(1000 / 60));
}

function drawOrb(orbR, state, env){
  ctx.save();
  const glowR = orbR * (3.2 + env * 0.5);
  const glow = ctx.createRadialGradient(cx, cy, orbR * 1.04, cx, cy, glowR);
  const glowA = state === "idle" ? 0.05 : state === "listening" ? 0.07 : state === "thinking" ? 0.08 : 0.1 + env * 0.09;
  glow.addColorStop(0, `rgba(140,170,255,${glowA})`);
  glow.addColorStop(0.18, `rgba(140,170,255,${glowA * 0.7})`);
  glow.addColorStop(0.4, `rgba(140,170,255,${glowA * 0.38})`);
  glow.addColorStop(0.65, `rgba(140,170,255,${glowA * 0.15})`);
  glow.addColorStop(0.86, `rgba(140,170,255,${glowA * 0.04})`);
  glow.addColorStop(1, "rgba(140,170,255,0)");
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(cx, cy, glowR, 0, 6.2832); ctx.fill();

  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, orbR, 0, 6.2832); ctx.clip();
  if (orbitRefReady){
    const d = orbR * 2.02;
    ctx.drawImage(
      orbitRef, ORBIT_REF_SRC.sx, ORBIT_REF_SRC.sy, ORBIT_REF_SRC.sw, ORBIT_REF_SRC.sh,
      cx - d / 2, cy - d / 2, d, d
    );
  } else {
    ctx.fillStyle = "#d7d9ea";
    ctx.fillRect(cx - orbR, cy - orbR, orbR * 2, orbR * 2);
  }

  const exposure = state === "speaking" ? 0.1 + env * 0.3
    : state === "thinking" ? 0.16
    : state === "listening" ? 0.08
    : 0.04 + Math.sin(clock * 0.9) * 0.02;
  if (exposure > 0.01){
    ctx.globalCompositeOperation = "screen";
    const exp = ctx.createRadialGradient(
      cx - orbR * 0.15, cy - orbR * 0.15, 0,
      cx, cy, orbR * 1.05
    );
    exp.addColorStop(0, `rgba(255,255,255,${exposure})`);
    exp.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = exp;
    ctx.beginPath(); ctx.arc(cx, cy, orbR, 0, 6.2832); ctx.fill();
    ctx.globalCompositeOperation = "source-over";
  }
  ctx.restore();
  ctx.restore();
}

function drawStatusPill(state, samples){
  const label = { idle: "Idle", listening: "Listening...", thinking: "Thinking...", speaking: "Speaking..." }[state] || "Idle";
  const on = state !== "idle";
  const pillW = Math.min(520, W * 0.42), pillH = 44;
  const px = cx - pillW / 2, py = H - Math.max(48, H * 0.09) - pillH / 2;

  ctx.save();
  roundRectPath(ctx, px, py, pillW, pillH, pillH / 2);
  ctx.fillStyle = "rgba(15,18,38,0.68)";
  ctx.fill();
  ctx.strokeStyle = `rgba(138,107,255,${on ? 0.4 : 0.22})`;
  ctx.lineWidth = 1;
  ctx.shadowColor = "#8a6bff";
  ctx.shadowBlur = on ? 12 : 4;
  ctx.stroke();
  ctx.restore();

  const midY = py + pillH / 2;

  const dotGrad = ctx.createLinearGradient(px + 20, midY, px + 28, midY);
  dotGrad.addColorStop(0, "#4fc3ff");
  dotGrad.addColorStop(1, "#8a6bff");
  ctx.fillStyle = dotGrad;
  ctx.globalAlpha = on ? 0.95 : 0.55;
  ctx.beginPath(); ctx.arc(px + 24, midY, 3, 0, 6.2832); ctx.fill();
  ctx.globalAlpha = 1;

  // "<NAME> ACTIVE" on the left, state label on the right, waveform
  // filling whatever real space is left between them — measured off the
  // actual rendered text each frame, not a fixed fraction of the pill.
  // The old fixed cx-centered band only worked for one specific name
  // length; "MERIDIAN ACTIVE" alone is long enough at this font size to
  // run straight into it, which is exactly the overlap this fixes — and
  // it now holds for any name someone picks, not just this one.
  ctx.textAlign = "left";
  ctx.font = "500 12px -apple-system, 'SF Pro Display', sans-serif";
  ctx.letterSpacing = "2px";
  const nameText = (AV.name || "MERIDIAN").toUpperCase() + " ACTIVE";
  const nameX = px + 40;
  ctx.fillStyle = "rgba(230,238,250,0.9)";
  ctx.fillText(nameText, nameX, midY + 4);
  const nameWidth = ctx.measureText(nameText).width;
  ctx.letterSpacing = "0px";

  ctx.textAlign = "right";
  ctx.font = "400 12px -apple-system, 'SF Pro Display', sans-serif";
  const labelWidth = ctx.measureText(label).width;

  const barsGap = 16;
  const barsX0 = nameX + nameWidth + barsGap;
  const barsX1 = (px + pillW - 24) - labelWidth - barsGap;
  const barsN = 40, barW = Math.max(0, (barsX1 - barsX0) / barsN);
  const barGrad = ctx.createLinearGradient(barsX0, 0, barsX0 + barsN * barW, 0);
  barGrad.addColorStop(0, "#4fc3ff");
  barGrad.addColorStop(1, "#8a6bff");
  ctx.fillStyle = barGrad;
  for (let i = 0; i < barsN; i++){
    const s = samples[Math.floor(i * 64 / barsN)] || 0;
    const amp = state === "speaking" ? s
      : state === "listening" ? 0.06 + 0.04 * Math.abs(Math.sin(i * 0.7 + clock * 3))
      : 0.04 + 0.02 * Math.sin(i * 0.5 + clock * 1.2);
    const barH = Math.max(1.5, amp * 20);
    ctx.globalAlpha = on ? 0.4 + 0.55 * amp : 0.22;
    ctx.fillRect(barsX0 + i * barW, midY - barH / 2, barW * 0.5, barH);
  }
  ctx.globalAlpha = 1;

  ctx.textAlign = "right";
  ctx.letterSpacing = "0.6px";
  ctx.fillStyle = on ? "rgba(150,200,240,0.85)" : "rgba(140,155,180,0.6)";
  ctx.fillText(label, px + pillW - 24, midY + 4);
  ctx.letterSpacing = "0px";
}

requestAnimationFrame(() => frame(16.6));
</script>
</body>
